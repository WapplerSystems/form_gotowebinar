services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WapplerSystems\FormGotowebinar\:
    resource: '../Classes/*'

  cache.formgotowebinar:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
    arguments: ['formgotowebinar']

  WapplerSystems\FormGotowebinar\Service\WebinarProvider:
    public: true
    arguments:
      $cache: '@cache.formgotowebinar'

  WapplerSystems\FormGotowebinar\Finishers\WebinarRegisterFinisher:
    public: true
    shared: false

  WapplerSystems\FormGotowebinar\GoTo\Client:
    public: true

  WapplerSystems\FormGotowebinar\Tca\WebinarItems:
    public: true
